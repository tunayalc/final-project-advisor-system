services:
  advisor:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /data/danisman_atama.db
    volumes:
      - advisor-data:/data
volumes:
  advisor-data:
